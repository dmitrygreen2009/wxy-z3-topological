name: Exact microscopic WXY validation
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'scripts/**', 'geometry/**', 'test/**', 'Project.toml', 'Manifest.toml', 'requirements.txt', '.github/workflows/itensor.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.0'
      - run: pip install -r requirements.txt
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: mkdir -p results
      - run: OPENBLAS_NUM_THREADS=1 python scripts/ed.py
      - run: python test/geometry_records.py
      - if: github.event_name == 'workflow_dispatch'
        run: julia --project=. scripts/torus_independent.jl
      - if: github.event_name == 'workflow_dispatch'
        run: OPENBLAS_NUM_THREADS=1 python scripts/torus_conventions.py
      - if: github.event_name == 'workflow_dispatch'
        run: OPENBLAS_NUM_THREADS=1 python scripts/torus_solver_audit.py
      - if: github.event_name == 'workflow_dispatch'
        run: python scripts/torus_gate.py
      - run: julia --project=. -e 'include("test/runtests.jl"); include("test/entanglement.jl"); include("test/transfer.jl"); include("test/checkpoints.jl")'
      - if: github.event_name == 'workflow_dispatch'
        run: julia --project=. test/audit_driver.jl
      - if: github.event_name == 'workflow_dispatch'
        run: julia --project=. scripts/validate.jl
