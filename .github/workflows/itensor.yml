name: Exact microscopic WXY validation
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'scripts/**', 'geometry/**', 'test/**', 'Project.toml', 'Manifest.toml', 'requirements.txt', 'requirements.lock.txt', '.github/workflows/itensor.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.0'
      - run: pip install -r requirements.lock.txt
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: mkdir -p results
      - run: OPENBLAS_NUM_THREADS=1 python scripts/ed.py
      - run: python test/geometry_records.py
      - run: python test/finite_result_collection.py
      - run: python scripts/primitive_filling_audit.py
      - run: python scripts/strategy_geometry_audit.py
      - run: python scripts/export_contractible_cycles.py
      - run: OPENBLAS_NUM_THREADS=1 python scripts/cgs_general_audit.py
      - run: python scripts/flatband_audit.py
      - run: OPENBLAS_NUM_THREADS=1 python scripts/parallel_edge_symmetry.py
      - run: OPENBLAS_NUM_THREADS=1 python scripts/star_trial_bound.py
      - run: OPENBLAS_NUM_THREADS=1 python test/cylinder_number_sectors.py
      - if: github.event_name == 'workflow_dispatch'
        run: julia --project=. scripts/torus_independent.jl
      - if: github.event_name == 'workflow_dispatch'
        run: OPENBLAS_NUM_THREADS=1 python scripts/torus_conventions.py
      - if: github.event_name == 'workflow_dispatch'
        run: OPENBLAS_NUM_THREADS=1 python scripts/torus_solver_audit.py
      - if: github.event_name == 'workflow_dispatch'
        run: python scripts/torus_gate.py
      - run: julia --project=. -e 'include("test/runtests.jl"); include("test/entanglement.jl"); include("test/transfer.jl"); include("test/checkpoints.jl"); include("test/triplet.jl"); include("test/cgs_projection.jl"); include("test/infinite_entropy.jl"); include("test/infinite_observables.jl"); include("test/particle_hole.jl"); include("test/spatial_partition.jl"); include("test/variational_bound.jl"); include("test/cgs_operator_mpo.jl"); include("test/infinite_triplet_correlations.jl"); include("test/contractible_operator_mpo.jl"); include("test/cgs_pair_operator_mpo.jl"); include("test/infinite_block_initializer.jl"); include("test/infinite_number_background.jl"); include("test/transfer_charge_labels.jl"); include("test/local_eigenpair_audit.jl"); include("test/parallel_vumps.jl"); include("test/infinite_cell_period.jl"); include("test/infinite_period_product.jl"); include("test/transfer_cell_period.jl"); include("test/finite_stationarity.jl")'
      - if: github.event_name == 'workflow_dispatch'
        run: julia --project=. test/infinite_period_measurement.jl
      - if: github.event_name == 'workflow_dispatch'
        run: julia --project=. test/audit_driver.jl
      - if: github.event_name == 'workflow_dispatch'
        run: julia --project=. scripts/validate.jl
